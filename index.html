<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog</title>
  <meta name="description" content="Blog pessoal" />
  <link rel="icon" type="image/jpeg" href="assets/jeffersom.jpg" />
  <link rel="stylesheet" href="assets/style.css" />
  <!-- markdown + highlight (CDN, versões fixas) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)" />
</head>
<body>
  <a class="skip" href="#main">Pular para o conteúdo</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/" aria-label="Início">
        <img class="brand-mark" src="assets/jeffersom.jpg" alt="" width="38" height="38" />
        <span class="brand-text">
          <span class="brand-title" data-site-title>Blog</span>
          <span class="brand-sub" data-site-subtitle></span>
        </span>
      </a>
      <nav class="social" data-social aria-label="Links"></nav>
      <div class="lang-switch" data-lang-switch role="group" aria-label="Idioma / Language"></div>
      <button class="theme-toggle" data-theme-toggle aria-label="Alternar tema" title="Alternar tema (claro/escuro)">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="wrap">
    <!-- lista -->
    <section data-view="list">
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="search" placeholder="Pesquisar posts…  (pressione /)" autocomplete="off" aria-label="Pesquisar posts" />
        <kbd class="kbd-hint">/</kbd>
      </div>
      <div class="tags" data-tags aria-label="Filtrar por tag"></div>
      <div class="post-list" data-post-list></div>
      <p class="empty" data-empty hidden>Nenhum post encontrado.</p>
    </section>

    <!-- post -->
    <section data-view="post" hidden>
      <a class="back" href="#/" data-i18n="back">← voltar</a>
      <p class="lang-note" data-lang-note hidden></p>
      <article class="post">
        <header class="post-head">
          <h1 data-post-title></h1>
          <div class="post-meta">
            <time data-post-date></time>
            <span data-post-reading></span>
            <span class="post-tags" data-post-tags></span>
          </div>
        </header>
        <div class="markdown" data-post-body></div>
      </article>
    </section>

    <p class="loading" data-loading>Carregando…</p>
    <p class="empty" data-notfound hidden>Post não encontrado. <a href="#/">Voltar ao início</a>.</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© <span data-year></span> <span data-site-author></span></span>
      <span class="footer-social" data-social-footer></span>
    </div>
  </footer>

  <script src="assets/app.js" defer></script>
</body>
</html>
